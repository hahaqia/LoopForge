# Source build of this checkout, layered on compose.yaml:
#   ./start.sh dev     or   docker compose -f compose.yaml -f compose.dev.yaml --profile platform up --build
# The fixed local tag keeps source builds from overwriting the pinned GHCR image.
services:
  platform:
    image: zhiyan-platform:local
    build:
      context: .
      args:
        ZHIYAN_BUILD_JOBS: ${ZHIYAN_BUILD_JOBS:-}
        ZHIYAN_COMMIT: ${ZHIYAN_COMMIT:-}
        CODEBUDDY_PACKAGE: ${CODEBUDDY_PACKAGE-@tencent-ai/codebuddy-code@2.167.0}
        GOPROXY: ${ZHIYAN_GOPROXY:-https://proxy.golang.org,direct}
    environment:
      AGENTFLOW_ISOLATED_IMAGE: zhiyan-platform:local
